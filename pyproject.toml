[tool.poetry]
name = "tap-messagebird"
version = "0.0.1"
description = "`tap-messagebird` is a Singer tap for Messagebird, built with the Meltano Singer SDK."
authors = ["Meltano"]
keywords = [
    "ELT",
    "Messagebird",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = ">=3.10"
requests = "^2.25.1"
singer-sdk = { version=">=0.46.0"}

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^22.10.0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_messagebird"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-messagebird = 'tap_messagebird.tap:TapMessagebird.cli'
